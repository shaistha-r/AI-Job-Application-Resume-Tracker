{% extends 'base.html' %}{% block title %}{{ 'Edit' if job else 'Add' }} Job{% endblock %}{% block content %}
<h1>{{ 'Edit' if job else 'Add' }} Job</h1><form method="post" class="card shadow-sm"><div class="card-body"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label>Company *</label><input class="form-control" name="company" value="{{ job.company if job else '' }}" required></div><div class="col-md-6"><label>Role *</label><input class="form-control" name="title" value="{{ job.title if job else '' }}" required></div><div class="col-md-6"><label>Location</label><input class="form-control" name="location" value="{{ job.location if job else '' }}"></div><div class="col-md-6"><label>Salary</label><input class="form-control" name="salary" value="{{ job.salary if job else '' }}"></div><div class="col-md-6"><label>Deadline</label><input class="form-control" type="date" name="deadline" value="{{ job.deadline.isoformat() if job and job.deadline else '' }}"></div><div class="col-md-6"><label>Status</label><select class="form-select" name="status">{% for s in statuses %}<option {{ 'selected' if job and job.status==s }}>{{ s }}</option>{% endfor %}</select></div><div class="col-12"><label>Job URL</label><input class="form-control" type="url" name="url" value="{{ job.url if job else '' }}"></div><div class="col-12"><label>Job Description *</label><textarea class="form-control" name="description" rows="10" required>{{ job.description if job else '' }}</textarea></div></div><button class="btn btn-primary mt-3">{{ 'Update Job' if job else 'Save Job' }}</button></div></form>{% endblock %}
