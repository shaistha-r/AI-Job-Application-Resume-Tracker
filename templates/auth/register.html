{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}
<div class="auth-card card shadow-sm"><div class="card-body p-4"><h2>Create account</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name</label><input class="form-control mb-3" name="name" required><label>Email</label><input class="form-control mb-3" type="email" name="email" required><label>Password</label><input class="form-control mb-3" type="password" name="password" minlength="6" required><label>Confirm password</label><input class="form-control mb-3" type="password" name="confirm_password" minlength="6" required><button class="btn btn-primary w-100">Register</button></form><p class="mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p></div></div>{% endblock %}
