{% extends 'base.html' %}{% block title %}Login{% endblock %}{% block content %}
<div class="auth-card card shadow-sm"><div class="card-body p-4"><h2>Welcome back</h2><p class="text-muted">Track applications and tailor your resume.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email</label><input class="form-control mb-3" type="email" name="email" required><label>Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Login</button></form><p class="mt-3 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div></div>{% endblock %}
