{% extends 'base.html' %}{% block title %}Upload Resume{% endblock %}{% block content %}<h1>Upload Resume</h1><div class="card shadow-sm"><div class="card-body"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Version name</label><input class="form-control mb-3" name="version_name" placeholder="e.g. Software Engineer Resume" required><label>Resume file</label><input class="form-control mb-3" type="file" name="resume" accept=".pdf,.docx" required><p class="text-muted">PDF or DOCX, maximum 5 MB.</p><button class="btn btn-primary">Upload & Parse</button></form></div></div>{% endblock %}
